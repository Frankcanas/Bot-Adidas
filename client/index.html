<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adidas CO - Chat de Soporte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/20/Adidas_Logo.svg" alt="Adidas Logo" class="logo">
            <h1>Soporte al Cliente</h1>
        </header>

        <main id="chat-container">
            <!-- Los mensajes aparecerán aquí -->
            <div class="message bot">
                <strong>Adidas Bot:</strong>
                <p>¡Hola! Soy tu asistente de Adidas Colombia. ¿En qué puedo ayudarte hoy? Pregúntame sobre envíos, pagos o devoluciones.</p>
            </div>
        </main>

        <footer>
            <div class="input-area">
                <input type="text" id="chat-input" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
                <button id="send-btn">Enviar</button>
            </div>
        </footer>
    </div>
    <script src="main.js"></script>
</body>
</html>
